<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PHARMACY — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__orb bg__orb--a"></div>
    <div class="bg__orb bg__orb--b"></div>
    <div class="bg__orb bg__orb--c"></div>
    <div class="bg__grid"></div>
  </div>

  <div id="app" class="app">
    <header class="topbar glass">
      <button id="backBtn" class="back-btn is-hidden" aria-label="Назад">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Назад</span>
      </button>
      <div class="brand">
        <span class="brand__pill">MINI APP</span>
        <h1 class="brand__title">PHARMACY</h1>
      </div>
      <div class="artist">ЛОСТЕНСОУЛ</div>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <footer class="footer">
      <span>Тексты: Genius</span>
      <span class="dot">·</span>
      <span id="counter"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
